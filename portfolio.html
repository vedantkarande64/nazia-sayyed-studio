<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work | Nazia Sayyed Studio</title><link rel="stylesheet" href="style.css"></head>
<body><div id="header-placeholder"></div>
<section class="page-hero"><div class="container page-hero-inner"><div><div class="eyebrow">SELECTED WORK</div><h1>WORK</h1></div><p>A collection of spaces shaped by purpose, people and place—across residential, commercial and retail interiors.</p></div></section>
<main class="container portfolio-content" id="portfolio-content"></main>
<div id="footer-placeholder"></div>
<div id="dynamic-viewer"><div class="viewer-shell"><button class="btn-back" onclick="closeProject()">← BACK TO WORK</button><div class="viewer-head"><h2 id="viewer-title">Project</h2><div class="viewer-subtitle" id="viewer-subtitle"></div></div><div id="viewer-content"></div></div></div>
<script src="components.js"></script>
<script>
let projectData={};
function escapeHtml(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
fetch('portfolio_data.json').then(r=>r.json()).then(data=>{projectData={};const root=document.getElementById('portfolio-content');['RESIDENTIAL','COMMERCIAL','RETAIL'].forEach(cat=>{const entries=Object.entries(data[cat]||{});entries.forEach(([id,p])=>projectData[id]={...p,category:cat});if(!entries.length)return;const block=document.createElement('section');block.className='category-block';block.innerHTML=`<div class="category-heading"><h2>${cat}</h2><span class="category-count">${entries.length} PROJECT${entries.length===1?'':'S'}</span></div><div class="portfolio-grid">${entries.map(([id,p],i)=>`<article class="portfolio-card" onclick="openProject('${id}')"><div class="portfolio-card-media"><img src="${p.thumbnail}" alt="${escapeHtml(p.title)}" loading="lazy"></div><div class="portfolio-card-meta"><span class="portfolio-index">${String(i+1).padStart(2,'0')}</span><div><div class="portfolio-title">${escapeHtml(p.title)}</div><div class="portfolio-location">${escapeHtml(p.location||'')}</div></div><span class="portfolio-arrow">→</span></div></article>`).join('')}</div>`;root.appendChild(block)});const requested=new URLSearchParams(location.search).get('project');if(requested&&projectData[requested])openProject(requested)}).catch(console.error);
function openProject(id){const p=projectData[id];if(!p)return;document.getElementById('viewer-title').textContent=p.title;document.getElementById('viewer-subtitle').innerHTML=`<span class="location">${escapeHtml(p.category)}${p.location?' · '+escapeHtml(p.location):''}</span>${p.tagline?`<span class="tagline">${escapeHtml(p.tagline)}</span>`:''}`;const content=document.getElementById('viewer-content');content.innerHTML='';const groups={};(p.images||[]).forEach(item=>{const label=item.label||'PROJECT';(groups[label]??=[]).push(item)});Object.entries(groups).forEach(([label,items])=>{const section=document.createElement('section');section.className='viewer-section';section.innerHTML=`<div class="viewer-section-title">${escapeHtml(label)}</div><div class="viewer-grid"></div>`;const grid=section.querySelector('.viewer-grid');items.forEach(item=>{const wrap=document.createElement('div');wrap.className='viewer-item';if(/\.(mp4|webm|mov)$/i.test(item.src)){wrap.innerHTML=`<video autoplay muted loop playsinline controls><source src="${item.src}"></video><span class="room-label">PROJECT VIDEO</span>`}else{wrap.innerHTML=`<img src="${item.src}" alt="${escapeHtml(item.label||p.title)}" loading="lazy"><span class="room-label">${escapeHtml(item.label||'')}</span>`}grid.appendChild(wrap)});content.appendChild(section)});document.getElementById('dynamic-viewer').classList.add('active');document.body.classList.add('no-scroll');history.replaceState(null,'',`portfolio.html?project=${encodeURIComponent(id)}`)}
function closeProject(){document.getElementById('dynamic-viewer').classList.remove('active');document.body.classList.remove('no-scroll');history.replaceState(null,'','portfolio.html')}
addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('dynamic-viewer').classList.contains('active'))closeProject()});
</script></body></html>
