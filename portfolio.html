<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Nazia Sayyed Studio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Belleza&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>

        /* --- PORTFOLIO HEADER --- */
        .portfolio-header { padding: 150px 5% 60px; text-align: center; }
        .portfolio-header h1 { font-family: var(--font-brand); font-size: 3.5rem; color: var(--accent); margin-bottom: 20px; }
        .portfolio-header p { font-size: 1.2rem; max-width: 600px; margin: 0 auto; color: var(--text-dark); }

        /* --- MAIN GALLERY GRIDS (THE CARDS) --- */
        .gallery-container { padding: 40px 5% 100px; }
        .category-title { 
            font-family: var(--font-brand); font-size: 2.5rem; margin: 60px 0 30px; 
            color: var(--accent); border-bottom: 1px solid rgba(74, 69, 66, 0.2); padding-bottom: 10px; 
        }
        
        .cards-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 30px;
        }

        .project-card {
            cursor: pointer; position: relative; overflow: hidden; background: #e3d8d1; aspect-ratio: 4/5;
        }
        .project-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s ease; }
        .project-card:hover img { transform: scale(1.05); }

        .card-overlay {
            position: absolute; bottom: 0; left: 0; right: 0; padding: 40px 20px 20px;
            background: linear-gradient(to top, rgba(44, 42, 41, 0.9), transparent);
            color: #fff; transform: translateY(10px); transition: transform 0.4s ease;
        }
        .project-card:hover .card-overlay { transform: translateY(0); }
        .card-overlay h3 { font-family: var(--font-brand); font-size: 1.5rem; margin-bottom: 5px; }
        .card-overlay p { font-size: 1rem; font-style: italic; opacity: 0.9; }

        /* --- DYNAMIC FULLSCREEN VIEWER --- */
        #dynamic-viewer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); z-index: 2000;
            overflow-y: auto; overflow-x: hidden; display: none; 
            opacity: 0; transition: opacity 0.4s ease;
        }
        #dynamic-viewer.active { display: block; opacity: 1; }

        /* UPDATED BACK BUTTON: Fixed position and high z-index so it never disappears */
        .btn-back {
            position: fixed; top: 30px; left: 5%; font-family: var(--font-brand);
            font-size: 1.2rem; cursor: pointer; border: none; background: rgba(248, 235, 226, 0.9);
            color: var(--accent); border-bottom: 1px solid var(--accent); padding: 5px 10px;
            z-index: 3000; border-radius: 4px; transition: background 0.3s ease;
        }
        .btn-back:hover { background: #e3d8d1; }

        .viewer-header { padding: 100px 5% 40px; position: relative; text-align: center; }
        .viewer-header h2 { font-family: var(--font-brand); font-size: 3rem; color: var(--accent); }
        .viewer-header p { font-size: 1.2rem; font-style: italic; color: #666; margin-top: 10px; }

        .room-section { margin-bottom: 80px; }
        .room-heading {
            font-family: var(--font-brand); font-size: 2rem; color: var(--accent);
            margin: 0 5% 30px; border-bottom: 1px solid rgba(74, 69, 66, 0.2); padding-bottom: 10px;
        }

        .viewer-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 0 5%; }
        .span-full { grid-column: span 2; }
        
        .img-wrapper { position: relative; overflow: hidden; background-color: #e3d8d1; aspect-ratio: 16/10; }
        .img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .img-wrapper::after {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 40%;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent); pointer-events: none;
        }

        .room-label {
            position: absolute; bottom: 25px; left: 25px; font-family: var(--font-brand);
            font-size: 1.2rem; color: #ffffff; z-index: 10; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        /* Mobile */
        @media (max-width: 900px) {
            .nav-links { display: none; }
            .viewer-grid { grid-template-columns: 1fr; }
            .span-full { grid-column: span 1; }
            .btn-back { top: 15px; font-size: 1rem; }
            .viewer-header { padding-top: 80px; }
        }
    </style>
</head>
<body>

    <!-- NAVIGATION -->
    <div id="header-placeholder"></div>

    <!-- HEADER -->
    <header class="portfolio-header">
        <h1>Featured Projects</h1>
        <p>A curated collection of our finest spaces. Click any project to explore.</p>
    </header>

    <!-- MAIN GALLERY CARDS (Auto-generated by JS) -->
    <div class="gallery-container" id="main-gallery-container">
        <!-- JS will inject categorized grids here -->
    </div>

    <!-- DYNAMIC PROJECT VIEWER OVERLAY -->
    <div id="dynamic-viewer">
        <!-- Fixed Back Button -->
        <button class="btn-back" onclick="closeProject()">← Back to Portfolio</button>
        
        <div class="viewer-header">
            <h2 id="viewer-title">Project Title</h2>
            <p id="viewer-subtitle">Project Subtitle</p>
        </div>
        
        <div id="viewer-content"></div>
    </div>

    <!-- JAVASCRIPT DATA MAP & LOGIC -->
    <script>
        let projectData = {};

        // 1. Fetch the JSON file
        fetch('portfolio_data.json')
            .then(response => response.json())
            .then(data => {
                // Combine all categories into one flat object for easy ID lookup when clicking a card
                projectData = { ...data.RESIDENTIAL, ...data.RETAIL, ...data.COMMERCIAL };
                
                // 2. Generate the Main Page Cards dynamically
                const galleryContainer = document.getElementById('main-gallery-container');
                galleryContainer.innerHTML = ''; 

                // Process categories in a specific order
                const categories = ['RESIDENTIAL', 'COMMERCIAL', 'RETAIL'];

                categories.forEach(category => {
                    if (data[category] && Object.keys(data[category]).length > 0) {
                        
                        // Create Category Title
                        const catTitle = document.createElement('h2');
                        catTitle.className = 'category-title';
                        // Format the title (e.g., "RESIDENTIAL" -> "Residential")
                        catTitle.innerText = category.charAt(0).toUpperCase() + category.slice(1).toLowerCase();
                        galleryContainer.appendChild(catTitle);

                        // Create the Grid for this Category
                        const grid = document.createElement('div');
                        grid.className = 'cards-grid';

                        // Iterate through the projects in this category
                        for (const [id, proj] of Object.entries(data[category])) {
                            
                            // Only create a card if there are images to show
                            if (proj.images && proj.images.length > 0) {
                                const card = document.createElement('div');
                                card.className = 'project-card';
                                card.onclick = () => openProject(id);

                                // Use the thumbnail from JSON, or a fallback if empty
                                const thumbSrc = proj.thumbnail ? proj.thumbnail : 'https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?w=600&q=80';
                                
                                // Default subtitle to the category name if subtitle is blank
                                const subtitleText = proj.subtitle ? proj.subtitle : category.charAt(0).toUpperCase() + category.slice(1).toLowerCase();

                                card.innerHTML = `
                                    <img src="${thumbSrc}" alt="${proj.title}">
                                    <div class="card-overlay">
                                        <h3>${proj.title}</h3>
                                        <p>${subtitleText}</p>
                                    </div>
                                `;
                                grid.appendChild(card);
                            }
                        }
                        galleryContainer.appendChild(grid);
                    }
                });
            })
            .catch(error => console.error('Error loading portfolio data:', error));

        // 3. Render the Project inside the Viewer
        function openProject(projectId) {
            const data = projectData[projectId];
            if (!data) return; 

            // Set Header Text
            document.getElementById('viewer-title').innerText = data.title;
            
            // Determine Subtitle for the viewer
            let subtitleText = data.subtitle;
            if (!subtitleText) {
                // Try to infer category if subtitle is empty
                if (data.images && data.images[0] && data.images[0].src.includes('COMMERCIAL')) subtitleText = "Commercial";
                else if (data.images && data.images[0] && data.images[0].src.includes('RETAIL')) subtitleText = "Retail";
                else subtitleText = "Residential";
            }
            document.getElementById('viewer-subtitle').innerText = subtitleText;

            const viewerContent = document.getElementById('viewer-content');
            viewerContent.innerHTML = ''; 

            // Group images by label
            const groups = {};
            data.images.forEach(imgData => {
                let groupName = imgData.label;
                if (/^\d+$/.test(groupName.trim()) || /^Img/i.test(groupName.trim())) {
                    groupName = "Project Gallery";
                }
                if (!groups[groupName]) {
                    groups[groupName] = [];
                }
                groups[groupName].push(imgData);
            });

            // Build Sections
            for (const [groupName, images] of Object.entries(groups)) {
                const section = document.createElement('div');
                section.className = 'room-section';
                
                if (groupName !== "Project Gallery") {
                    const heading = document.createElement('h3');
                    heading.className = 'room-heading';
                    heading.innerText = groupName;
                    section.appendChild(heading);
                }

                const grid = document.createElement('div');
                grid.className = 'viewer-grid';

                images.forEach((imgData, index) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'img-wrapper';

                    if (index === 0 && images.length > 2) {
                        wrapper.classList.add('span-full');
                    }

                    const img = document.createElement('img');
                    img.src = imgData.src; 
                    img.alt = imgData.label;

                    const labelSpan = document.createElement('span');
                    labelSpan.className = 'room-label';
                    labelSpan.innerText = imgData.label; 

                    wrapper.appendChild(img);
                    wrapper.appendChild(labelSpan);
                    grid.appendChild(wrapper);
                });

                section.appendChild(grid);
                viewerContent.appendChild(section);
            }

            // Show Viewer and block background scrolling
            const viewer = document.getElementById('dynamic-viewer');
            viewer.classList.add('active');
            viewer.scrollTop = 0; // Ensure it opens at the top
            document.body.style.overflow = 'hidden'; 
        }

        // 4. Close Viewer Function
        function closeProject() {
            document.getElementById('dynamic-viewer').classList.remove('active');
            document.body.style.overflow = 'auto'; 
        }
    </script>
    <div id="footer-placeholder"></div>
    <script src="components.js"></script>
</body>
</html>
